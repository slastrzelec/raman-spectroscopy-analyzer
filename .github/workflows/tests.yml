name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest -v

      - name: Smoke-test app import (catches import-time errors before deploy)
        run: |
          python -c "
          import ast
          with open('app.py', encoding='utf-8') as f:
              ast.parse(f.read())
          print('app.py: syntax OK')
          "
